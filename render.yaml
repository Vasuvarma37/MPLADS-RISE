# Render Deployment Configuration
# Push to GitHub, connect repo to Render, and it auto-deploys

services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: mplads-rise-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard to your Supabase URL
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false  # Set manually in Render dashboard (e.g. admin123)
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          name: mplads-rise-frontend
          type: web
          property: hostURL   # hostURL includes https:// — fixes CORS
    healthCheckPath: /health

  # ── Frontend ──────────────────────────────────────────────────────────────
  - type: web
    name: mplads-rise-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: BACKEND_URL
        # Points nginx proxy to the actual Render backend service URL
        value: https://mplads-rise.onrender.com



# Render Deployment Configuration
# Push to GitHub, connect repo to Render, and it auto-deploys

services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: mplads-rise-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard to your Supabase URL
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false  # Must be set manually in dashboard to override the default
      - key: SECRET_KEY
        generateValue: true
      - key: CHROMA_HOST
        value: mplads-chromadb
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          name: mplads-rise-frontend
          type: web
          property: host
    healthCheckPath: /health

  # ── Frontend ──────────────────────────────────────────────────────────────
  - type: web
    name: mplads-rise-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    buildCommand: ""
    startCommand: ""


